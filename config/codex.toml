# Secret-free template for the private ~/.codex/config.toml; never symlink this file.
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
personality = "pragmatic"
model_reasoning_summary = "detailed"
hide_agent_reasoning = false
show_raw_agent_reasoning = true
service_tier = "priority"
plan_mode_reasoning_effort = "xhigh"

notify = ["/Users/eakudompong.chanoknan/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[tui]
status_line = ["model-with-reasoning", "context-remaining", "project-name", "git-branch"]
theme = "gruvbox-dark"
status_line_use_colors = true
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-6.1-sol" = 3

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers."codemode-mcp-gateway"]
url = "http://127.0.0.1:4791/mcp"
bearer_token_env_var = "GW_MCP_TOKEN"
# gw serve provisions the Authorization header only in the private local copy.
startup_timeout_sec = 60
tool_timeout_sec = 60

[mcp_servers."codemode-mcp-gateway".tools.execute]
approval_mode = "approve"

[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/eakudompong.chanoknan/.codex:/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
CODEX_HOME = "/Users/eakudompong.chanoknan/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab,mcpapps"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.1007.71326"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/Users/eakudompong.chanoknan/.codex/plugins/cache/openai-bundled/browser/26.1007.71326/scripts/browser-service.mjs","sky":"@oai/sky/service"}'
SKY_CUA_SERVICE_PATH = "/Users/eakudompong.chanoknan/.codex/computer-use/Codex Computer Use.app"
CODEX_CLI_PATH = "/Applications/ChatGPT.app/Contents/Resources/codex-cli/CodexCLI.app/Contents/MacOS/codex"

[features]
terminal_resize_reflow = true
js_repl = false

[desktop]
appearanceTheme = "system"
appearanceLightCodeThemeId = "gruvbox"
appearanceDarkCodeThemeId = "gruvbox"
useFontSmoothing = true
usePointerCursors = false
conversationDetailMode = "STEPS_COMMANDS"
reviewDelivery = "inline"
show-context-window-usage = true
hotkey-window-projectless-default-enabled = false
ambient-suggestions-enabled = false
appearanceDiffMarkerStyle = "color"
defaultTerminalLocation = "bottom"
git-branch-prefix = ""
keepRemoteControlAwakeWhilePluggedIn = true
followUpQueueMode = "queue"
dock-icon-preference = "codex-system"
browser-show-full-url = true
reduced-motion-preference = "system"

[desktop.appearanceLightChromeTheme]
accent = "#458588"
accentSource = "custom"
contrast = 78
ink = "#3c3836"
opaqueWindows = true
surface = "#fbf1c7"

[desktop.appearanceLightChromeTheme.fonts]
code = '"SFMono-Regular"'
ui = "Inter"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#3c3836"
diffRemoved = "#cc241d"
skill = "#b16286"

[desktop.appearanceDarkChromeTheme]
accent = "#458588"
accentSource = "custom"
contrast = 80
ink = "#ebdbb2"
opaqueWindows = true
surface = "#282828"

[desktop.appearanceDarkChromeTheme.fonts]
code = '"Jetbrains Mono"'
ui = "Inter"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#ebdbb2"
diffRemoved = "#cc241d"
skill = "#b16286"

[projects."/Users/eakudompong.chanoknan/Code/personal/mcm"]
trust_level = "trusted"

[projects."/Users/eakudompong.chanoknan/Code/prtimes-dev-docker/prtimes-frontend/src"]
trust_level = "trusted"

[[skills.config]]
path = "/Users/eakudompong.chanoknan/.codex/skills/hatch-pet/SKILL.md"
enabled = false

[marketplaces.openai-bundled]
source_type = "local"
source = "/Users/eakudompong.chanoknan/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "/Users/eakudompong.chanoknan/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[plugins."browser@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true
