# Launch with `cx` or `codex --profile dotfiles` (Codex 0.134.0+).
# Machine-specific settings and MCP registrations stay in ~/.codex/config.toml.
model = "gpt-6-luna"
model_context_window = 1050000
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "xhigh"
model_reasoning_summary = "detailed"
personality = "pragmatic"
hide_agent_reasoning = false
show_raw_agent_reasoning = true
service_tier = "fast"

[tui]
status_line = ["model-with-reasoning", "context-remaining", "project-name", "git-branch"]
theme = "gruvbox-dark"
