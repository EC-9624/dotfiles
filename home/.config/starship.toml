"$schema" = "https://starship.rs/config-schema.json"

scan_timeout = 100
command_timeout = 500
follow_symlinks = false
add_newline = true

format = """
$directory\
${custom.giturl}\
$git_branch\
${custom.git_worktree}\
$git_status\
$cmd_duration\
$line_break\
$python\
$character\
"""

[directory]
style = "cyan"
format = "[ $path ]($style)"
truncation_length = 0
truncate_to_repo = false
home_symbol = "~"

[line_break]
disabled = false

[character]
success_symbol = "[❯](bold magenta)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[cmd_duration]
min_time = 5000
style = "yellow"
format = " [ $duration ]($style)"

[python]
format = "([$virtualenv]($style) )"
style = "bright-black"
detect_extensions = []
detect_files = []
detect_folders = []

[custom.giturl]
description = "Display symbol for remote Git server"
command = """
GIT_REMOTE=$(command git ls-remote --get-url 2> /dev/null)
if [[ "$GIT_REMOTE" =~ "github" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "gitlab" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "bitbucket" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "git" ]]; then
    GIT_REMOTE_SYMBOL=" "
else
    GIT_REMOTE_SYMBOL=" "
fi
echo "$GIT_REMOTE_SYMBOL"
"""
when = "git rev-parse --is-inside-work-tree 2> /dev/null"
format = "[$output](bright-black)"
require_repo = true
ignore_timeout = true

[git_branch]
symbol = " "
style = "fg:yellow bg:bright-black"
format = " [ $symbol$branch ]($style) "

[git_status]
format = "$untracked$staged$modified$renamed$deleted$conflicted$ahead_behind"
staged = "[+${count} ](cyan)"
modified = "[!${count} ](bright-red)"
renamed = "[»${count} ](blue)"
deleted = "[-${count} ](red)"
untracked = "[?${count} ](yellow)"
stashed = "[≡${count} ](magenta)"
conflicted = "[✖${count} ](red bold)"
ahead = "[⇡${count} ](bright-black)"
behind = "[⇣${count} ](bright-black)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count} ](bright-black)"

[custom.git_worktree]
description = "Show indicator when inside a git worktree"
command = """
if git rev-parse --git-dir >/dev/null 2>&1; then
      common_dir=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null)
      git_dir=$(git rev-parse --path-format=absolute --git-dir 2>/dev/null)
      if [ "$common_dir" != "$git_dir" ]; then
            echo "⛓"
      fi
fi
"""
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
format = "([ $output ]($style))"
style = "bold green"
require_repo = true
ignore_timeout = true
